<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turret Frenzy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="ui">
      <h1>Turret Frenzy</h1>
      <div class="stats">
        <span id="waveLabel">Wave 1</span>
        <span id="hpLabel">HP: 100</span>
        <span id="shieldLabel">Shield: 0</span>
        <span id="xpLabel">XP: 0 / 100</span>
        <span id="bossLabel">Boss: None</span>
      </div>
      <p class="hint">Aim with mouse · Hold click/space to fire · Survive fixed waves + bosses</p>
    </div>

    <aside id="loadoutPanel">
      <h2>Active Upgrades</h2>
      <ul id="upgradeList">
        <li>None yet — level up to choose boosts.</li>
      </ul>
    </aside>

    <div id="modPanels"></div>

    <canvas id="gameCanvas" width="1100" height="700" aria-label="Turret game canvas"></canvas>

    <div id="overlay" class="hidden">
      <div id="overlayCard">
        <h2 id="overlayTitle">Choose an Upgrade</h2>
        <p id="overlaySubtitle">Select one of your power picks</p>
        <div id="choices"></div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
